name: Container end-to-end
on:
  push:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build containers
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Check end-to-end issue flow
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl --fail-with-body -sS -X POST http://localhost:8080/run | tee result.json
          python3 -c 'import json; d=json.load(open("result.json")); assert d["ok"], d'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down
